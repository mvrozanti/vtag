<html lang="en">
<head>

<body>
<header class="vt-head">
  <div class="mv-topbar vt-bar">
    <span class="mv-topbar__name"><span class="brand">vtag</span></span>

      <a class="mv-tabs__tab" href="#/search" data-route="#/search">search</a>

      <a href="https://hub.mvr.ac/">hub</a>
    </span>

<main id="view"><div class="mv-empty">loading…</div></main>
<aside id="panel" class="vt-sheet" hidden aria-hidden="true" aria-label="item">
  <div class="vt-sheet__inner" id="panel-inner"></div>
</aside>
<div id="toast" class="vt-toast" role="status" hidden></div>
